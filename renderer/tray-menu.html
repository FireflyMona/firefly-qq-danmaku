<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>托盘菜单</title>
  <link rel="stylesheet" href="tray-menu.css" />
</head>
<body>
  <div class="menu">
    <button class="item" id="toggleBtn">
      <span id="showText" class="word show">显示</span><span class="plain slash">/</span><span id="hideText" class="word hide">隐藏</span><span class="plain suffix">弹幕</span>
    </button>
    <div class="divider"></div>
    <button class="item" id="refreshBtn">刷新</button>
    <div class="divider"></div>
    <button class="item" id="uninstallBtn">卸载软件</button>
    <div class="divider"></div>
    <button class="item" id="quitBtn">退出程序</button>
  </div>
  <script src="tray-menu.js"></script>
</body>
</html>
