<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>流萤QQ弹窗显示 - 设置</title>
  <link rel="stylesheet" href="settings.css" />
</head>
<body>
  <main>
    <header>
      <h1>设置</h1>
      <p id="conn" class="conn">未连接</p>
    </header>
    <form id="form">
      <label>OneBot WebSocket 地址
        <input id="wsUrl" type="text" placeholder="ws://127.0.0.1:3001" />
      </label>
      <label>Access Token（可选）
        <input id="token" type="password" placeholder="留空表示无 token" />
      </label>
      <label>断线重连间隔（毫秒）
        <input id="reconnectMs" type="number" min="1000" step="500" />
      </label>
      <div class="grid">
        <label>弹幕宽度占比（%）
          <input id="widthPercent" type="number" min="10" max="100" />
        </label>
        <label>弹幕高度上限（% 屏幕高）
          <input id="maxHeightPercent" type="number" min="5" max="100" />
        </label>
        <label>字号（px）
          <input id="fontSize" type="number" min="10" max="40" />
        </label>
        <label>不透明度
          <input id="opacity" type="number" min="0.1" max="1" step="0.02" />
        </label>
        <label>每行停留秒数
          <input id="secondsPerLine" type="number" min="1" max="30" />
        </label>
      </div>
      <fieldset>
        <legend>显示内容</legend>
        <label class="check"><input id="showPrivate" type="checkbox" /> 私聊消息</label>
        <label class="check"><input id="showGroup" type="checkbox" /> 群聊消息</label>
        <label class="check"><input id="showNotice" type="checkbox" /> 群通知</label>
      </fieldset>
      <footer>
        <button id="save" type="submit">保存设置</button>
        <span id="saved" class="saved" hidden>已保存</span>
      </footer>
    </form>
  </main>
  <script src="settings.js"></script>
</body>
</html>
