<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>设置</title>
  <link rel="stylesheet" href="settings.css" />
</head>
<body>
  <main>
    <header>
      <h1 data-i18n="settings.title">设置</h1>
      <p id="conn" class="conn" data-i18n="settings.notConnected">未连接</p>
    </header>
    <form id="form">
      <label><span data-i18n="settings.wsUrl">OneBot WebSocket 地址</span>
        <input id="wsUrl" type="text" placeholder="ws://127.0.0.1:3001" />
      </label>
      <label><span data-i18n="settings.token">Access Token（可选）</span>
        <input id="token" type="password" data-i18n-placeholder="settings.tokenPlaceholder" placeholder="留空表示无 token" />
      </label>
      <label><span data-i18n="settings.reconnectMs">断线重连间隔（毫秒）</span>
        <input id="reconnectMs" type="number" min="1000" step="500" />
      </label>
      <div class="grid">
        <label><span data-i18n="settings.widthPercent">弹幕宽度占比（%）</span>
          <input id="widthPercent" type="number" min="10" max="100" />
        </label>
        <label><span data-i18n="settings.maxHeightPercent">弹幕高度上限（% 屏幕高）</span>
          <input id="maxHeightPercent" type="number" min="5" max="100" />
        </label>
        <label><span data-i18n="settings.fontSize">字号（px）</span>
          <input id="fontSize" type="number" min="10" max="40" />
        </label>
        <label><span data-i18n="settings.opacity">不透明度</span>
          <input id="opacity" type="number" min="0.1" max="1" step="0.02" />
        </label>
        <label><span data-i18n="settings.secondsPerLine">每行停留秒数</span>
          <input id="secondsPerLine" type="number" min="1" max="30" />
        </label>
      </div>
      <fieldset>
        <legend data-i18n="settings.displayContent">显示内容</legend>
        <label class="check"><input id="showPrivate" type="checkbox" /> <span data-i18n="settings.showPrivate">私聊消息</span></label>
        <label class="check"><input id="showGroup" type="checkbox" /> <span data-i18n="settings.showGroup">群聊消息</span></label>
        <label class="check"><input id="showNotice" type="checkbox" /> <span data-i18n="settings.showNotice">群通知</span></label>
      </fieldset>
      <fieldset>
        <legend data-i18n="settings.wechatSection">微信消息（微信 4.x + wechatauto）</legend>
        <label class="check"><input id="enableWechat" type="checkbox" /> <span data-i18n="settings.enableWechat">启用微信消息（需微信 4.x 已登录 + Python wechatauto-replica）</span></label>
        <p id="wechatConn" class="conn" data-i18n="settings.wechatDisabled">微信未启用</p>
      </fieldset>
      <fieldset>
        <legend data-i18n="settings.language">语言</legend>
        <label class="check"><span data-i18n="settings.language">语言</span>
          <select id="language">
            <option value="zh">中文</option>
            <option value="en">English</option>
          </select>
        </label>
      </fieldset>
      <footer>
        <button id="save" type="submit" data-i18n="settings.save">保存设置</button>
        <span id="saved" class="saved" hidden data-i18n="settings.saved">已保存</span>
      </footer>
    </form>
  </main>
  <script src="i18n.js"></script>
  <script src="settings.js"></script>
</body>
</html>
